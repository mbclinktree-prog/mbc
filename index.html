<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Montevideo Beer Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#EC7E1A;
    --bg:#0f0a05;
    --ink:#050505;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans','Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .container{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- Botón compartir (arriba a la derecha) ---- */
  .share-top{
    position:fixed;top:16px;right:16px;z-index:20;
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.04);
    color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .share-top:hover{background:rgba(255,255,255,.12)}
  .share-top svg{width:17px;height:17px;fill:currentColor}

  .avatar{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    background:var(--orange);
  }
  .name{
    margin-top:18px;
    color:#fff;
    font-weight:600;
    font-size:24px;
    line-height:1.25;
    text-align:center;
    letter-spacing:.2px;
  }
  .socials{
    display:flex;gap:20px;margin-top:14px;margin-bottom:26px;
  }
  .socials:empty{display:none}
  .socials a{
    color:#fff;display:flex;opacity:.85;transition:transform .15s ease,opacity .15s ease;
  }
  .socials a:hover{transform:scale(1.12);opacity:1}
  .socials svg{width:22px;height:22px;fill:#fff}

  .links{width:100%;display:flex;flex-direction:column;gap:16px}
  .link{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:64px;
    background:#fff;
    color:var(--ink);
    text-decoration:none;
    border-radius:3px;
    padding:14px 46px;
    text-align:center;
    font-weight:500;
    font-size:15.5px;
    line-height:1.35;
    transition:transform .14s ease,background .14s ease;
  }
  .link:hover{transform:scale(1.01);background:#f6f6f6}
  .link:active{transform:scale(.995)}
  .link .label{display:block}
  .link .sub{
    display:block;
    margin-top:4px;
    font-weight:400;
    font-size:12px;
    line-height:1.4;
    color:#6b6b6b;
  }

  /* Miniatura a la izquierda */
  .link .thumb{
    position:absolute;left:8px;top:8px;
    width:48px;height:calc(100% - 16px);
    object-fit:cover;border-radius:4px;
    background:#eee;
  }

  /* Menú "kebab" (compartir link) a la derecha */
  .link .kebab{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    height:60%;width:40px;
    display:flex;align-items:center;justify-content:center;
    border-left:1px solid rgba(0,0,0,.08);
    color:#111;opacity:.55;
    transition:opacity .15s ease;
  }
  .link .kebab:hover{opacity:1}
  .link .kebab svg{width:4px;height:18px;fill:currentColor}
  .link .kebab.copied::after{
    content:"Copiado";
    position:absolute;right:44px;top:50%;transform:translateY(-50%);
    background:#111;color:#fff;font-size:11px;font-weight:500;
    padding:3px 7px;border-radius:5px;white-space:nowrap;
  }

  .footer{margin-top:44px;text-align:center}
  .footer-logo{
    width:52px;height:52px;border-radius:12px;object-fit:cover;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }

  @media (max-width:480px){
    body{padding:44px 14px 52px}
    .name{font-size:21px}
    .link{font-size:15px;padding:14px 44px}
  }

  /* ---- Menú modal ---- */
  .modal-overlay{
    position:fixed;inset:0;z-index:1000;
    background:rgba(10,7,3,.82);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    padding:24px;
    opacity:0;transition:opacity .2s ease;
  }
  .modal-overlay.open{display:flex;opacity:1}
  .modal{
    position:relative;
    width:100%;max-width:820px;height:88vh;
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
    transform:translateY(12px) scale(.98);
    transition:transform .22s ease;
  }
  .modal-overlay.open .modal{transform:translateY(0) scale(1)}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--orange);color:#fff;
    font-weight:700;font-size:15px;flex:none;
  }
  .modal-head .actions{display:flex;align-items:center;gap:6px}
  .modal-head a.open-tab{
    color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;
    padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.18);
    transition:background .15s ease;
  }
  .modal-head a.open-tab:hover{background:rgba(255,255,255,.32)}
  .modal-close{
    border:none;background:rgba(255,255,255,.18);color:#fff;
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .modal-close:hover{background:rgba(255,255,255,.32)}
  .modal-body{flex:1;min-height:0;background:#525659}
  .modal-body iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <button class="share-top" onclick="sharePage()" aria-label="Compartir perfil">
    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 100-6 3 3 0 00-3 3c0 .24.04.47.09.7L8.04 9.81A3 3 0 006 9a3 3 0 100 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 102.92-2.92z"></path></svg>
  </button>

  <main class="container">
    <img class="avatar" id="avatar" src="assets/avatar.jpg" alt="Montevideo Beer Company">
    <h1 class="name" id="name">Montevideo Beer Company</h1>
    <div class="socials" id="socials"></div>
    <nav class="links" id="links"></nav>
    <footer class="footer">
      <img class="footer-logo" id="footerLogo" src="assets/avatar.jpg" alt="Montevideo Beer Company">
    </footer>
  </main>

  <!-- Menú modal -->
  <div class="modal-overlay" id="menuModal" onclick="if(event.target===this)closeMenu()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Menú MBC">
      <div class="modal-head">
        <span id="modalTitle">Menú 🍔🍻</span>
        <div class="actions">
          <a class="open-tab" id="modalOpenTab" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
          <button class="modal-close" onclick="closeMenu()" aria-label="Cerrar">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="menuBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="defaults.js"></script>
  <script src="mbc.js"></script>
  <script>
    var CURRENT_PDF = "";

    function esc(s){
      return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }

    var KEBAB_SVG = '<svg viewBox="0 0 4 18"><circle cx="2" cy="2" r="2"></circle><circle cx="2" cy="9" r="2"></circle><circle cx="2" cy="16" r="2"></circle></svg>';

    function render(cfg){
      document.title = cfg.profile.name || "Linktree";
      var av = cfg.profile.avatar_url || "assets/avatar.jpg";
      document.getElementById("avatar").src = av;
      document.getElementById("avatar").alt = cfg.profile.name || "";
      document.getElementById("footerLogo").src = av;
      document.getElementById("name").textContent = cfg.profile.name || "";

      var soc = document.getElementById("socials");
      soc.innerHTML = "";
      (cfg.socials || []).forEach(function(s){
        if(!s || !s.url) return;
        var a = document.createElement("a");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener";
        a.setAttribute("aria-label", s.type || "link");
        a.innerHTML = MBC.socialSvg(s.type);
        soc.appendChild(a);
      });

      var wrap = document.getElementById("links");
      wrap.innerHTML = "";
      (cfg.links || []).filter(function(l){ return l && l.enabled !== false && l.url; }).forEach(function(l){
        var a = document.createElement("a");
        a.className = "link";
        a.href = l.url;
        if(l.kind === "pdf"){
          a.setAttribute("role", "button");
          a.addEventListener("click", function(e){ openMenu(e, l); });
        } else {
          a.target = "_blank";
          a.rel = "noopener";
        }
        a.addEventListener("click", function(){ MBC.logEvent("click", l); });

        var html = "";
        if(l.thumb_url) html += '<img class="thumb" src="' + esc(l.thumb_url) + '" alt="">';
        html += '<span class="label">' + esc(l.label);
        if(l.sublabel) html += '<span class="sub">' + esc(l.sublabel) + '</span>';
        html += '</span>';
        html += '<span class="kebab" role="button" aria-label="Compartir" data-share="' + esc(l.url) + '">' + KEBAB_SVG + '</span>';
        a.innerHTML = html;
        wrap.appendChild(a);
      });

      wrap.querySelectorAll(".kebab").forEach(function(k){
        k.addEventListener("click", function(e){
          e.preventDefault(); e.stopPropagation();
          var url = k.getAttribute("data-share") || location.href;
          if(navigator.share){ navigator.share({ url: url }).catch(function(){}); }
          else if(navigator.clipboard){
            navigator.clipboard.writeText(url);
            k.classList.add("copied");
            setTimeout(function(){ k.classList.remove("copied"); }, 1200);
          }
        });
      });
    }

    function openMenu(e, link){
      if(e) e.preventDefault();
      if(link){
        CURRENT_PDF = link.url;
        document.getElementById("modalTitle").textContent = link.label || "Menú";
        document.getElementById("modalOpenTab").href = link.url;
      }
      var body = document.getElementById("menuBody");
      body.innerHTML = "";
      var f = document.createElement("iframe");
      f.src = CURRENT_PDF + "#toolbar=1&navpanes=0&view=FitH";
      f.title = "Menú";
      body.appendChild(f);
      document.getElementById("menuModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeMenu(){
      document.getElementById("menuModal").classList.remove("open");
      document.getElementById("menuBody").innerHTML = "";
      document.body.style.overflow = "";
    }
    document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeMenu(); });

    function sharePage(){
      var data = { title: document.title, url: location.href };
      if(navigator.share){ navigator.share(data).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); }
    }

    (function init(){
      render(MBC.normalize(null)); // pinta de inmediato con defaults
      MBC.loadConfig().then(function(cfg){ render(cfg); });
      try{
        if(!sessionStorage.getItem("mbc_viewed")){
          sessionStorage.setItem("mbc_viewed", "1");
          MBC.logEvent("view", null);
        }
      }catch(e){ MBC.logEvent("view", null); }
    })();
  </script>
</body>
</html>
